plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = 'dev.briefestboxer'
base { archivesName = "briefest-boxer-${minecraft_version}-forge" }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach { workingDirectory project.file('run') }
        client {}
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

sourceSets.main.java.srcDir('../../../common/src/main/java')
sourceSets.main.java.exclude('dev/briefestboxer/core/SulfurCubeHitModel.java')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
