plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()
    mods {
        briefest_boxer {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets.main.java.srcDir('../../../common/src/main/java')

repositories {
    maven { url = 'https://maven.terraformersmc.com/' }
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "com.terraformersmc:modmenu:${modmenu_version}"
    // Exercise the actual rendering hooks with Sodium by default in dev/game
    // tests, without making it a dependency of the released Briefest Boxer jar.
    if (!project.hasProperty('withoutSodium')) {
        runtimeOnly "maven.modrinth:AANobbMI:a9YZH3ip"
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'briefest_boxer_test'
        enableGameTests = false
        enableClientGameTests = true
    }
}

sourceSets.named('gametest') {
    compileClasspath += sourceSets.main.output + sourceSets.client.output
    runtimeClasspath += sourceSets.main.output + sourceSets.client.output
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
