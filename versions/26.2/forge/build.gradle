plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = mod_version
group = 'dev.briefestboxer'
base { archivesName = "briefest-boxer-${minecraft_version}-forge" }

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// ForgeGradle 7.0.40 defaults its Slimelauncher toolchain to Java 8, which
// cannot launch Minecraft 26.2. Pin the dev launcher to the game's Java 25.
fgtools {
    configure('slimelauncher') { tool ->
        tool.javaLauncher.set(javaToolchains.launcherFor { spec ->
            spec.languageVersion.set(JavaLanguageVersion.of(25))
        })
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach { workingDir = project.file('run') }
        client {
            // LWJGL's macOS Cocoa window must be initialized on the JVM's first thread.
            jvmArgs '-XstartOnFirstThread'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
}

sourceSets.main.java.srcDir('../../../common/src/main/java')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

// Include the project license and the GPL terms incorporated by LGPL 3.0.
jar {
    from('../../../') {
        include 'LICENSE', 'COPYING'
    }
}
